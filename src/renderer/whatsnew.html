<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'" />
  <title>Novedades de CapiUploader</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/whatsnew.css" />
</head>
<body class="wn">
  <header class="wn-head">
    <img class="wn-logo" src="assets/icon.png" alt="" />
    <div class="wn-heading">
      <p class="wn-kicker">Novedades</p>
      <h1 id="wnTitle">CapiUploader</h1>
      <p class="wn-meta" id="wnMeta"></p>
    </div>
  </header>

  <main class="wn-body" id="wnBody" aria-live="polite">
    <div class="wn-loading" id="wnLoading">
      <span class="wn-skel w70"></span><span class="wn-skel w90"></span><span class="wn-skel w60"></span>
      <span class="wn-skel w80"></span><span class="wn-skel w50"></span>
    </div>
    <article class="wn-notes" id="wnNotes" hidden></article>
    <div class="wn-empty" id="wnEmpty" hidden>
      <p id="wnEmptyText"></p>
    </div>
  </main>

  <footer class="wn-foot">
    <button type="button" class="btn ghost" id="wnGithub">Ver en GitHub</button>
    <span class="wn-spacer"></span>
    <button type="button" class="btn primary" id="wnClose">Entendido</button>
  </footer>

  <script src="js/whatsnew-window.js"></script>
</body>
</html>
